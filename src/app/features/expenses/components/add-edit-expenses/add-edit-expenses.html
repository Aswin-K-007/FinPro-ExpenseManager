<div class="container mt-4">
  <h3>{{ expenseId ? 'Edit Expense' : 'Add Expense' }}</h3>

  <form (ngSubmit)="saveExpense()" #expenseForm="ngForm">
    <div class="mb-3">
      <label class="form-label">Category</label>
      <input type="text" [(ngModel)]="expense.category" name="category" required class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Amount</label>
      <input type="number" [(ngModel)]="expense.amount" name="amount" required class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" [(ngModel)]="expense.date" name="date" required class="form-control" />
    </div>

    <button type="submit" class="btn btn-success me-2">Save</button>
    <button type="button" class="btn btn-secondary" routerLink="/expenses">Cancel</button>
  </form>
</div>
