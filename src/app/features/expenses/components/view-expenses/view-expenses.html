<div class="expenses-container container">
  <div class="card expenses-card">
    <div class="card-header">
      <h3 class="mb-0">Your Expenses</h3>

      <button
        class="btn btn-sm btn-outline-info"
        [routerLink]="['/expenses/add']"
      >
        <h5 class="mb-0">Add New Expense</h5>
      </button>
    </div>


    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table expenses-table mb-0 align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            @for (expense of expenses; track expense.id) {
              <tr>
                <td>{{ expense.id }}</td>
                <td class="fw-semibold">{{ expense.title || '-' }}</td>
                <td>{{ expense.category }}</td>
                <td>{{ expense.amount | currency:'INR' }}</td>
                <td>{{ expense.date | date:'mediumDate' }}</td>
                <td>{{expense.notes}}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-outline-info me-2"
                    [routerLink]="['/expenses/edit', expense.id]"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="deleteExpense(expense.id)"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <i class="bi bi-wallet2 me-2"></i> No expenses found
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
