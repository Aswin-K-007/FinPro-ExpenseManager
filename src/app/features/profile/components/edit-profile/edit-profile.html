<div class="profile-container edit-profile-card">
  <h3>Edit Profile</h3>

  <form (ngSubmit)="onSave()" #profileForm="ngForm" class="profile-form">
    <div class="form-grid">
      <div class="form-column">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input
            type="text"
            [(ngModel)]="user.name"
            name="name"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input
            type="text"
            [(ngModel)]="user.username"
            name="username"
            required
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea
            [(ngModel)]="user.address"
            name="address"
            rows="4"
            class="form-control"
          ></textarea>
        </div>
        
      </div>

      <!-- Right Column -->
      <div class="form-column">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            type="email"
            [(ngModel)]="user.email"
            name="email"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input
            type="text"
            [(ngModel)]="user.mobile"
            name="mobile"
            required
            minlength="10"
            maxlength="10"
            class="form-control"
          />
        </div>
      </div>
    </div>

    <div class="btn-container">
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="profileForm.invalid"
      >
        Save Changes
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
