<div class="profile-container mt-4">
  <h3 class="mb-4 text-center">Edit Profile</h3>

  <form (ngSubmit)="onSave()" #profileForm="ngForm" class="profile-form">
    <div class="form-group mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" [(ngModel)]="user.name" name="name" required class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label class="form-label">Username</label>
      <input type="text" [(ngModel)]="user.username" name="username" required class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label class="form-label">Email</label>
      <input type="email" [(ngModel)]="user.email" name="email" required class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label class="form-label">Mobile Number</label>
      <input type="text" [(ngModel)]="user.mobile" name="mobile" required minlength="10" maxlength="10" class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label class="form-label">Address</label>
      <textarea [(ngModel)]="user.address" name="address" rows="3" class="form-control"></textarea>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-success me-2" [disabled]="profileForm.invalid">Save Changes</button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
