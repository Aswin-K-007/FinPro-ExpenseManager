<div class="container mt-5">
  <div class="profile-card mx-auto">
    <div class="profile-header text-center">
      <div class="profile-pic">
        <img src="assets/images/default-avatar.png" alt="Profile Picture" />
      </div>
      <h3 class="mt-3">{{ user.name }}</h3>
      <p class="text-muted mb-0">{{ user.email }}</p>
    </div>

    <div class="profile-body mt-4">
      <h5 class="section-title">Personal Details</h5>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>Username</span>
          <span class="fw-bold">{{ user.username }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>Mobile</span>
          <span class="fw-bold">{{ user.mobile }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>Address</span>
          <span class="fw-bold">{{ user.address }}</span>
        </li>
      </ul>

      <h5 class="section-title">Account Info</h5>
      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>Member Since</span>
          <span class="fw-bold">{{ user.joinedDate | date }}</span>
        </li>
      </ul>

      <div class="text-center">
        <button class="btn btn-outline-primary me-2" routerLink="/profile/edit">
          Edit Profile
        </button>
        <a routerLink="/home" class="btn btn-outline-light">Back to Home</a>
      </div>
    </div>
  </div>
</div>
